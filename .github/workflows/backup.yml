name: Back up the repository

# Insurance against losing the repo to a takedown, an account problem, or a
# mistake. A git bundle is the whole history in one file: `git clone` it and
# you have the repository back, remotes and all.
on:
  push:
    branches: [main, "claude/**"]
  schedule:
    # Weekly, so a repo that goes quiet still has a recent backup.
    - cron: "17 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # a shallow clone cannot make a usable bundle

      - name: Pack the full history into one file
        run: |
          git bundle create lechery-$(date +%Y%m%d).bundle --all
          git bundle verify lechery-$(date +%Y%m%d).bundle

      - uses: actions/upload-artifact@v4
        with:
          name: repo-bundle
          path: "*.bundle"
          retention-days: 90

  mirror:
    runs-on: ubuntu-latest
    # Dormant until MIRROR_ENABLED is set, so adding a mirror later is two
    # secrets and a variable, with no code change.
    if: vars.MIRROR_ENABLED == 'true'
    steps:
      - name: Push a full mirror
        env:
          MIRROR_URL: ${{ secrets.MIRROR_URL }}
          MIRROR_TOKEN: ${{ secrets.MIRROR_TOKEN }}
          # GitLab accepts "oauth2" as the username for a personal access
          # token. Other hosts differ, so it is a variable rather than a
          # hardcoded convention.
          MIRROR_USER: ${{ vars.MIRROR_USER || 'oauth2' }}
          SOURCE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -eu
          if [ -z "$MIRROR_URL" ] || [ -z "$MIRROR_TOKEN" ]; then
            echo "::warning::MIRROR_ENABLED is set but MIRROR_URL or MIRROR_TOKEN is empty"
            exit 0
          fi

          # A bare mirror clone rather than the workspace checkout: a normal
          # checkout has only the built branch under refs/heads, so pushing
          # --mirror from it would quietly back up one branch.
          git clone --mirror "$SOURCE" source.git
          cd source.git

          # The URL carries the token, so it is assembled and used without
          # ever being echoed, and lives only in this step's environment.
          set +x
          git push --mirror "https://${MIRROR_USER}:${MIRROR_TOKEN}@${MIRROR_URL#https://}"
          echo "mirrored to ${MIRROR_URL}"
