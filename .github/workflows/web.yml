name: Build and publish the web version

# Runs on both branches so a build break shows up on the working branch
# rather than at merge time. Only main publishes.
on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push should cancel an in-flight build rather than queue behind it:
# when iterating from a phone, the latest push is the only one that matters.
concurrency:
  group: web
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        # svelte-check covers the components; tsc alone would miss them.
        run: npm run check

      - name: Run tests
        # A broken build reaching the phone wastes a round trip, so the
        # suite gates the deploy.
        run: npm test

      - name: Build
        run: npm run build:fast

      - name: Check the build produced a page that can reach its assets
        # A script tag pointing at a file that was never copied fails
        # silently in the browser, and on a phone there is no console to
        # find out from.
        run: |
          test -f dist/index.html || {
            echo "::error::the build produced no index.html"
            ls -la dist || true
            exit 1
          }
          test -f dist/vendor/dynamic-avatar-drawer/da.js || {
            echo "::error::the avatar library was not copied into the build"
            exit 1
          }
          du -sh dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
